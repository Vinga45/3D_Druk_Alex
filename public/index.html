<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шар — 3D-друк і вироби</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><span class="logo">Шар</span>
  <div class="hbar">
    <div class="lang" role="group" aria-label="Language"><button data-lang="uk">UA</button><button data-lang="en">EN</button></div>
    <button class="btn alt" id="open"><span data-i18n="cart"></span> (<span id="count">0</span>)</button>
  </div>
</div></header>
<section class="hero"><div class="wrap">
  <div><h1 data-i18n="h1"></h1><p data-i18n="lead"></p></div>
  <div class="print" role="img" aria-label="3D print layers"></div>
</div></section>
<main class="wrap">
  <div class="tools"><h2 data-i18n="catalog"></h2><input id="q" type="search" data-ph="search"></div>
  <div class="grid" id="grid"></div>
</main>
<footer><div class="wrap" data-i18n="foot"></div></footer>

<dialog id="pm" aria-label="Product">
  <button class="btn alt x" id="pclose" data-i18n="close"></button>
  <div id="pbody"></div>
</dialog>

<aside id="cart">
  <div class="row" style="margin:0"><h2 data-i18n="cart"></h2><button class="btn alt" id="close" data-i18n="close"></button></div>
  <div id="lines"></div>
  <p><b><span data-i18n="total"></span>: <span id="total">0 ₴</span></b></p>
  <form id="order" hidden>
    <label><span data-i18n="fName"></span>*<input name="name" required maxlength="100" autocomplete="name"></label>
    <label><span data-i18n="fPhone"></span>*<input name="phone" type="tel" required autocomplete="tel"></label>
    <label><span data-i18n="fEmail"></span><input name="email" type="email" autocomplete="email"></label>
    <label><span data-i18n="fCity"></span>*<input name="city" required autocomplete="address-level2"></label>
    <label><span data-i18n="fBranch"></span>*<input name="branch" required></label>
    <label><span data-i18n="fPay"></span><select name="payment"><option value="Накладений платіж" data-i18n="pay1"></option><option value="Переказ на картку" data-i18n="pay2"></option></select></label>
    <label><span data-i18n="fComment"></span><textarea name="comment" rows="3"></textarea></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="msg"></p>
    <button class="btn" data-i18n="submit"></button>
  </form>
</aside>
<script src="app.js"></script>
</body>
</html>
